name: Build Android app

on:
  workflow_dispatch:   # run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # lets the build publish the app as a Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Sign every build with the SAME key, so new versions install over old
      # ones. Without this, each build gets a random key and Android refuses
      # the update with "App not installed".
      - name: Use the fixed signing key
        env:
          KEY_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::error::The DEBUG_KEYSTORE_B64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/toyremote.keystore"
          echo "TOYREMOTE_KEYSTORE=$RUNNER_TEMP/toyremote.keystore" >> "$GITHUB_ENV"
          echo "Signing key fingerprint:"
          keytool -list -v -keystore "$RUNNER_TEMP/toyremote.keystore" -storepass android | grep "SHA256:"

      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Give the app file a friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk ToyRemote.apk

      - name: Upload the finished app
        uses: actions/upload-artifact@v4
        with:
          name: ToyRemote-Android
          path: ToyRemote.apk

      - name: Publish a Release with a direct download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${{ github.run_number }}" ToyRemote.apk \
            --title "Toy Remote for Android (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap ToyRemote.apk to download it."

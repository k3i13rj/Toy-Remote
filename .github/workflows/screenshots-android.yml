name: Android screenshots

on:
  workflow_dispatch:   # run manually from the Actions tab

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Enable KVM (makes the virtual phone fast)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on a virtual phone and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.toyremote.app/.MainActivity
            sleep 8
            adb exec-out screencap -p > screenshot-1-top.png
            adb shell input swipe 540 1900 540 500 400
            sleep 2
            adb exec-out screencap -p > screenshot-2-middle.png
            adb shell input swipe 540 1900 540 500 400
            sleep 2
            adb exec-out screencap -p > screenshot-3-lower.png
            adb shell input swipe 540 1900 540 500 400
            sleep 2
            adb exec-out screencap -p > screenshot-4-bottom.png

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: screenshot-*.png
          if-no-files-found: ignore

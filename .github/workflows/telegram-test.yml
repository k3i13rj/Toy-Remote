name: Telegram test (simulated toy)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to keep the bot running"
        default: "15"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # lets it save the results to the "telegram-test" branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the TEST version (toy is simulated)
        run: gradle assembleDebug -PtestMode=true --no-daemon --stacktrace

      - name: Enable KVM (makes the virtual phone fast)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the bot on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/telegram-test.sh ${{ github.event.inputs.minutes }}

      - name: Save the results to the "telegram-test" branch
        if: always()
        run: |
          ls test-results/* > /dev/null 2>&1 || exit 0
          cp -r test-results /tmp/results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan telegram-test
          git rm -rf -q .
          cp /tmp/results/* .
          git add screen-*.png app-log.txt
          git commit -q -m "Telegram test results from run ${{ github.run_number }}"
          git push -f origin telegram-test
